[package]
name = "helios-bsc-execution"
description = "Verified execution reads via eth_getProof against consensus stateRoot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# EVM fork times live with the rest of the fork table rather than being copied here.
# `helios-bsc-config` depends only on `-types`, so this adds no cycle.
helios-bsc-config = { workspace = true }
helios-bsc-types = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
revm = { version = "43.0", default-features = false, features = ["std", "optional_block_gas_limit", "optional_eip3607", "optional_no_base_fee"] }
