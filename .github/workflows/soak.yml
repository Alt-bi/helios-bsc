name: soak

# Nightly differential soak against live BSC mainnet.
#
# This exists because of how this client has actually failed. Twice the cause was
# fork-parameter drift, not a coding mistake: the pre-Fermi attestation-target rule
# wedged the client on honest mainnet headers, and `turnLength` was a compile-time
# constant that would wedge it the day validators vote it up. Neither was caught by the
# suite — every fixture pins the chain as it was when the fixture was taken. Only a run
# against the live chain can notice, and only a *scheduled* one notices without somebody
# remembering to look.
#
# Free to run: the repository is public, so Actions minutes are not billed, and both
# endpoints below are keyless. No secrets, which is also why this is safe to read.
#
# Note: GitHub disables `schedule` on repositories with no activity for 60 days. If this
# job stops appearing, that is why — push anything, or re-enable it in the Actions tab.

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: the top of the hour is when every other cron on
    # the platform fires, and the public RPC endpoints feel it.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Soak seconds (manual runs; the nightly schedule always uses 2700)"
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    # The soak itself is capped at 45 min; the rest is build and checkout headroom.
    timeout-minutes: 90
    env:
      # Proof upstream. At the BLS-finalized head the required window is ~2 blocks rather
      # than ~112, which this free keyless endpoint clears.
      UPSTREAM: https://bsc-mainnet.public.blastapi.io
      # Oracle. Must be a different host, and must serve the `parlia_` namespace: the
      # finality cross-check is the only check that tests our attestation bookkeeping
      # against geth's own answer. Most public BSC endpoints answer -32601 for it.
      ORACLE: https://bsc-rpc.publicnode.com
      # Third host, used only to confirm the checkpoint. It has to be a third: the
      # checkpoint is written from ORACLE, so confirming it there is circular, and
      # confirming it against UPSTREAM is refused as the same host that serves the proofs.
      CHECKPOINT_ORACLE: https://bsc-dataseed.bnbchain.org
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p helios-bsc --locked

      - name: Write a fresh checkpoint
        # Written every run rather than committed: a checkpoint goes stale in 24h, and
        # writing it here means `write-checkpoint` — including the epoch-activation
        # refusal — is exercised nightly too.
        run: |
          set -euo pipefail
          tip=$(curl -sS --retry 3 --retry-delay 5 -m 30 \
                 -H 'Content-Type: application/json' -H 'User-Agent: helios-bsc-ci' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                 "$ORACLE" | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["result"],16))')
          epoch=$(( tip / 1000 * 1000 ))
          block=$tip
          # A checkpoint inside an epoch's activation window is refused by design; step
          # back to the previous epoch's tail instead of retrying into the same refusal.
          if [ $(( tip - epoch )) -lt 87 ]; then
            block=$(( epoch - 1 ))
            epoch=$(( epoch - 1000 ))
          fi
          echo "tip=$tip checkpoint=$block epoch=$epoch"
          ./target/release/helios-bsc write-checkpoint \
            --upstream "$ORACLE" \
            --block "$(printf '0x%x' "$block")" \
            --sealing-set-from-epoch "$(printf '0x%x' "$epoch")" \
            --out checkpoint.json

      - name: Soak the block surface through the local RPC
        # Does not fail the job on its own. A flaky data plane here would otherwise
        # cancel the 45-minute soak below, trading the larger signal for the smaller
        # one. A real disagreement still fails the job -- the check step after this
        # one turns MISMATCH into an error.
        continue-on-error: true
        # The long soak below covers the account trie: balances, nonces, storage,
        # eth_call. Everything derived from a block -- receipts, logs, filters -- is a
        # separate surface, and it needs the real server because that is where the
        # derivation lives. So this starts `run` and drives it over HTTP.
        #
        # Deliberately before the 45-minute soak, not after: the checkpoint is written
        # one step earlier, and by the end of that soak it would be three quarters of an
        # hour and ~6000 blocks stale, so bootstrap alone could outlast the readiness
        # probe. `--no-checkpoint-store` keeps this run from rewriting the file the soak
        # is about to use.
        #
        # Provider split, measured 2026-08-25 (docs/proof-provider-matrix.md): no free
        # keyless host serves both eth_getProof and eth_getBlockReceipts. BlastAPI serves
        # proofs and answers 401 for receipts; publicnode is the reverse. `--backup` is
        # transport failover and covers exactly that -- it changes who is asked, never
        # what is checked, since receipts still bind to the sealed receiptsRoot.
        #
        # The comparison oracle is the third host, so nothing is compared against the
        # process that served it. dataseed refuses eth_getLogs outright, so the log check
        # reports SKIP there; receipts and the filter round trip still run.
        run: |
          set -euo pipefail
          ./target/release/helios-bsc run \
            --upstream "$UPSTREAM" \
            --backup "$ORACLE" \
            --checkpoint checkpoint.json \
            --no-checkpoint-store \
            --listen 127.0.0.1:8545 > rpc.log 2>&1 &
          echo $! > rpc.pid
          # Wait for a head rather than sleeping a fixed amount: bootstrap time depends on
          # how far the checkpoint is behind, which varies run to run.
          for _ in $(seq 1 60); do
            if curl -sS -m 5 -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                 http://127.0.0.1:8545 2>/dev/null | grep -q '"result"'; then
              break
            fi
            sleep 5
          done
          HELIOS_BSC_LOCAL=http://127.0.0.1:8545 \
          HELIOS_BSC_ORACLE="$CHECKPOINT_ORACLE" \
            python3 scripts/soak_vs_oracle.py --rounds 4 --interval 45 2>&1 | tee surface.log

      - name: Stop the local RPC
        if: always()
        run: |
          if [ -f rpc.pid ]; then kill "$(cat rpc.pid)" 2>/dev/null || true; fi

      - name: Check the block surface was actually exercised
        if: always()
        # A detector that quietly stops detecting is worse than none. The script exits 1
        # on a mismatch on its own; this only catches the case where every check skipped,
        # which means the run proved nothing about receipts. A warning rather than a
        # failure, for the same reason --min-unique is low above: a red build that is
        # usually a throttled provider gets ignored.
        run: |
          if grep -q "MISMATCH" surface.log 2>/dev/null; then
            echo "::error::RECEIPT/LOG MISMATCH — a field this client derives disagreed with an independent chain."
            grep -B2 -A4 "MISMATCH" surface.log | head -40
            exit 1
          fi
          if grep -qE "^  receipts  [0-9]+ checks  OK" surface.log 2>/dev/null; then
            echo "receipt surface exercised:"
            grep -E "^  (receipts|logs|filter) " surface.log | tail -12
          else
            echo "::warning::The receipt surface never ran a check, so this run proves nothing about receipts. Read surface.log and rpc.log; suspect the data plane, not the client."
            tail -20 rpc.log 2>/dev/null || true
          fi

      - name: Soak vs an independent oracle
        # `--finality fast` is what `run` now serves by default, so it is what needs
        # watching. `--require-multisource-checkpoint` makes this exercise the strict
        # path: three independent hosts, and a checkpoint no two of them agree on is
        # fatal rather than a warning.
        #
        # --min-unique is deliberately low: a red build that is usually a throttled
        # provider gets ignored, and an ignored detector is worse than none. Real
        # failures do not depend on it — a mismatch or a wedged walk fails the run on
        # its own.
        run: |
          set -euo pipefail
          ./target/release/helios-bsc soak \
            --upstream "$UPSTREAM" \
            --oracle "$ORACLE" \
            --checkpoint checkpoint.json \
            --checkpoint-oracle "$CHECKPOINT_ORACLE" \
            --require-multisource-checkpoint \
            --finality fast \
            --state soak-state.json \
            --duration-secs "${{ github.event_name == 'schedule' && '2700' || inputs.duration_secs || '600' }}" \
            --min-unique 3 \
            2>&1 | tee soak.log

      - name: Classify the failure
        if: failure()
        # A human reading the failure mail should know in five seconds whether to care.
        # A mismatch means an oracle and a proof disagreed and is always worth reading; a
        # wedged walk usually means a fork moved under the pin; everything else is the
        # providers having a bad night.
        run: |
          if grep -q "MISMATCH" soak.log 2>/dev/null; then
            echo "::error::VERIFICATION MISMATCH — a proof and the oracle disagreed. Read soak.log."
            grep -B2 -A2 "MISMATCH" soak.log | head -40
          elif grep -q "compared nothing" soak.log 2>/dev/null; then
            echo "::error::WALK WEDGED — the client refuses headers the chain accepts. Suspect a fork parameter; check the upstream-pin job."
            grep -E "snapshot [0-9]+|cascading|wait window" soak.log | tail -20
          elif grep -qE "parlia_\* finality cross-check never ran" soak.log 2>/dev/null; then
            echo "::warning::The oracle stopped serving parlia_*. Not a client fault; pick another oracle."
          elif grep -q "MISMATCH" surface.log 2>/dev/null; then
            echo "::error::RECEIPT/LOG MISMATCH — a derived field disagreed with an independent chain. Read surface.log."
            grep -B2 -A4 "MISMATCH" surface.log | head -40
          else
            echo "::warning::No mismatch and no wedge — most likely provider throttling. Check the SKIP lines."
            grep -E "SKIP" soak.log surface.log 2>/dev/null | tail -20
          fi

      - name: Upload log and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ github.run_id }}
          path: |
            soak.log
            surface.log
            rpc.log
            soak-state.json
            checkpoint.json
          retention-days: 30
