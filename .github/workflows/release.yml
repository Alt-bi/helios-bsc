name: release

# Build binaries on a `v*` tag and attach them to a GitHub Release.
#
# Until this existed, using helios-bsc meant cloning the repository, installing a Rust
# toolchain and building it. That is a wall in front of everyone who is not already a
# Rust developer, which is almost everyone the project is for.
#
# Only first-party actions plus the `gh` CLI. This client's whole argument is about not
# trusting things you have not checked, so its release path does not pull third-party
# actions that could rewrite what ships. `dtolnay/rust-toolchain` is the one exception,
# pinned to the same action `ci.yml` already uses.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, so it runs on distributions older than the runner's glibc. This is
          # the one most people want and the reason `musl-tools` is installed below —
          # `blst` and `secp256k1` compile C, so the target needs a C toolchain too.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64-gnu
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
          # Cross-compiled from the arm64 runner rather than built on `macos-13`: that
          # image has been retired, so the job queued indefinitely with no runner ever
          # assigned — and because `release` needs every build, one stuck matrix entry
          # meant no release at all. Apple's toolchain targets both arches from either.
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Third-party actions run arbitrary code in this job, with access to the tree
      # before `cargo build` sees it. A tag or a branch is a name its owner can move;
      # a commit SHA is not. Dependabot updates these lines and shows the diff, which
      # is the point: an update becomes something a human reads rather than something
      # that happens. `# stable` / `# v2.9.2` say what the SHA was when it was pinned.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        # `--locked` so the artifact is built from the committed lockfile and not from
        # whatever resolved that morning.
        run: cargo build --release --locked -p helios-bsc --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          out="helios-bsc-${{ matrix.name }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/helios-bsc" "dist/$out/"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$out/"
          tar -C dist -czf "$out.tar.gz" "$out"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "helios-bsc-${{ matrix.name }}"
          New-Item -ItemType Directory -Force "dist/$out" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/helios-bsc.exe" "dist/$out/"
          Copy-Item README.md, LICENSE-APACHE, LICENSE-MIT "dist/$out/"
          Compress-Archive -Path "dist/$out" -DestinationPath "$out.zip"

      - name: Smoke-test the artifact
        # A binary that cannot start is not a release. `info` touches the fork table and
        # the build metadata without needing an RPC endpoint, so it runs anywhere.
        #
        # Skipped only where the runner cannot execute what it just built: the arm64
        # macOS runner produces the x86_64 artifact by cross-compilation.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/helios-bsc"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" info

      - uses: actions/upload-artifact@v7
        with:
          name: helios-bsc-${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- container
  #
  # Downloading a binary is one wall lower than building from source; `docker run` is
  # one lower still, and it is how anyone evaluating this on a server will try it.
  #
  # Built per architecture on a native runner rather than emulated. A cross-built arm64
  # image under QEMU compiles `blst` and `secp256k1` through an emulator, which turns a
  # few minutes into the better part of an hour. GitHub gives public repositories arm64
  # runners, so each arch builds where it runs and a manifest list joins them. arm64
  # matters here beyond tidiness: the cheapest VPS instances are arm, and this client is
  # meant to run on the cheapest thing that will hold it.
  #
  # `docker` CLI only, no third-party actions, for the reason at the top of this file:
  # nothing that could rewrite what ships gets to run in the release path.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Only these two jobs get it, and only to push this repository's own image.
      packages: write
    outputs:
      # Both matrix legs compute the same pair. Exporting them means the manifest job
      # joins exactly what was pushed rather than re-deriving it and drifting -- and it
      # could not re-derive `edge-<sha>` anyway, since that needs a checkout it lacks.
      image: ${{ steps.names.outputs.image }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name and tag
        id: names
        # ghcr rejects uppercase in a repository path and this owner has one ("Alt-bi"),
        # so the name is lowercased rather than interpolated raw.
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="edge-$(git rev-parse --short HEAD)"
          fi
          {
            echo "IMAGE=$image"
            echo "VERSION=$version"
          } >> "$GITHUB_ENV"
          {
            echo "image=$image"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "building $image:$version-${{ matrix.arch }}"

      - name: Log in to ghcr.io
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            --label "org.opencontainers.image.description=Trust-minimized Parlia light client for BNB Smart Chain - local verified JSON-RPC" \
            -t "${IMAGE}:${VERSION}-${{ matrix.arch }}" \
            .

      - name: Smoke-test the image
        # Same rule as the binaries above: an image that cannot start is not a release.
        # `info` reads the fork table and build metadata and needs no network.
        run: docker run --rm "${IMAGE}:${VERSION}-${{ matrix.arch }}" info

      - name: The image must still refuse a non-loopback bind
        # The entrypoint binds 0.0.0.0 *inside* the container, which is only safe because
        # compose publishes on 127.0.0.1 and the binary demands --allow-non-loopback.
        # There is no RPC auth in this process, so if that flag ever became implied, an
        # image published straight onto a host port would answer the whole network.
        # `assert_listen_policy` runs before any checkpoint or upstream work, so this
        # fails fast and for the stated reason rather than on a connection error.
        run: |
          set -euo pipefail
          if docker run --rm "${IMAGE}:${VERSION}-${{ matrix.arch }}" \
               run --listen 0.0.0.0:8545 --upstream http://127.0.0.1:1 >out.txt 2>&1; then
            echo "::error::non-loopback bind was accepted without --allow-non-loopback"
            cat out.txt
            exit 1
          fi
          if ! grep -qi "loopback" out.txt; then
            echo "::error::it refused, but not for the loopback reason -- check what changed"
            cat out.txt
            exit 1
          fi
          echo "refused as expected:"
          cat out.txt

      - name: The default entrypoint must warn that it is reachable
        # The step above proves the *binary* refuses a non-loopback bind without the flag.
        # It does not describe how this image is actually run: the Dockerfile `CMD` already
        # carries `--allow-non-loopback`, because Docker NAT is not loopback and a
        # published port cannot reach a process bound to 127.0.0.1. So for image users the
        # guard is pre-satisfied, the loopback Host check is inactive too, and the only
        # thing standing between them and an open unauthenticated RPC is the `127.0.0.1:`
        # prefix on their own `-p` argument.
        #
        # Nothing can stop `-p 8545:8545` from here. What this asserts is that when it
        # happens, the operator is told, in the log they will actually read.
        #
        # No arguments: this runs the published `CMD`, which is what a careless
        # `docker run` gets. The unreachable upstream makes it exit on its own after the
        # bind policy has had its say, so there is no container to wait on or clean up.
        # The grepped phrases are pinned by a unit test in `bin/helios-bsc/src/bind.rs`,
        # so a reword breaks there first instead of leaving this check passing on nothing.
        run: |
          set -euo pipefail
          docker run --rm -e HELIOS_BSC_UPSTREAM=http://127.0.0.1:1 \
            "${IMAGE}:${VERSION}-${{ matrix.arch }}" >warn.txt 2>&1 || true
          cat warn.txt
          for phrase in "no authentication in this process" "-p 127.0.0.1:8545:8545" "broadcast raw transactions"; do
            if ! grep -qF -- "$phrase" warn.txt; then
              echo "::error::the default entrypoint no longer warns: missing '$phrase'"
              exit 1
            fi
          done
          echo "the open-port warning survives the default entrypoint"

      - name: The published image is healthy-by-construction
        # A container can be up, answering on its port, and stalled -- upstream gone or
        # the sync thread wedged -- and neither `restart: unless-stopped` nor /metrics
        # says so, because both read state that keeps looking fine. The HEALTHCHECK is
        # the only thing in the image that can tell those apart, so a release that lost
        # it would ship a blind container. Read off the built image, not the Dockerfile.
        run: |
          set -euo pipefail
          test="$(docker inspect --format '{{json .Config.Healthcheck.Test}}' \
                  "${IMAGE}:${VERSION}-${{ matrix.arch }}")"
          echo "healthcheck: ${test}"
          if [ "${test}" = "null" ] || [ -z "${test}" ]; then
            echo "::error::the built image declares no HEALTHCHECK"
            exit 1
          fi
          if ! echo "${test}" | grep -qF '"health"'; then
            echo "::error::the healthcheck no longer runs the health subcommand"
            exit 1
          fi

      - name: The binary must survive the hardening compose applies
        # compose.yaml hands operators `read_only`, `cap_drop: [ALL]`,
        # `no-new-privileges` and a tmpfs. Those cost nothing *if* the process really
        # needs no capabilities and writes nothing outside its checkpoint volume. That
        # is a claim about the binary, and claims about the binary get checked here
        # rather than discovered by whoever runs `docker compose up` first.
        #
        # Two runs. `info` proves normal startup works with a read-only root and no
        # capabilities at all. `health` against a dead port proves the probe the
        # HEALTHCHECK invokes also runs under it -- and that it fails closed, with the
        # reason, rather than crashing or hanging.
        run: |
          set -euo pipefail
          harden="--read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp"
          # shellcheck disable=SC2086
          docker run --rm ${harden} "${IMAGE}:${VERSION}-${{ matrix.arch }}" info > hardened.txt
          grep -q 'chain_id:' hardened.txt || {
            echo "::error::the image cannot run under read_only + cap_drop ALL"
            cat hardened.txt
            exit 1
          }
          # shellcheck disable=SC2086
          if docker run --rm ${harden} "${IMAGE}:${VERSION}-${{ matrix.arch }}" \
               health --url http://127.0.0.1:1 --timeout-secs 5 > probe.txt 2>&1; then
            echo "::error::the health probe reported healthy against a dead port"
            cat probe.txt
            exit 1
          fi
          cat probe.txt
          grep -qF 'unhealthy: no answer' probe.txt || {
            echo "::error::it failed, but not for the unreachable-RPC reason -- check what changed"
            exit 1
          }
          echo "the image runs, and its probe fails closed, under the compose hardening"

      - name: Push
        run: docker push "${IMAGE}:${VERSION}-${{ matrix.arch }}"

  # One tag that resolves to the right architecture, assembled from the per-arch images
  # above. `docker manifest` ships with the CLI, so this needs no buildx builder.
  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Create and push the manifest list
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"

          # `latest` means the newest release, so it moves only on a tag -- never on a
          # manual run from a branch.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker manifest create "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
            docker manifest push "${IMAGE}:latest"
          fi

          echo "published ${IMAGE}:${VERSION}"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only job that needs write, and only to attach files to its own tag.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=$(mktemp)
          {
            echo "## What this is"
            echo
            echo "A trust-minimized local JSON-RPC for BNB Smart Chain. It answers wallet"
            echo "reads from proofs it verified itself against Parlia consensus, so a lying"
            echo "upstream RPC produces an error rather than a wrong balance."
            echo
            echo "**It is not a node.** It has no chain storage and no p2p; it sits in front"
            echo "of an ordinary RPC endpoint and checks what that endpoint says. It serves"
            echo "the wallet read surface — see \`docs/rpc-matrix.md\` for exactly what is"
            echo "verified, what is passthrough, and what is refused."
            echo
            echo "Start here: [docs/quickstart.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/quickstart.md)"
            echo
            echo "## Verify your download"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } > "$notes"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$notes" \
            --verify-tag \
            artifacts/*
