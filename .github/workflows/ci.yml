name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Channel matches rust-toolchain.toml (stable + clippy, rustfmt); not nightly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test
        # `set -o pipefail` is load-bearing, not decoration. The default shell here is
        # `bash -e`, where the exit status of a pipeline is the *last* command's -- so
        # `cargo test | tee` would report tee's success and a failing test suite would
        # stop failing the build. Piping into tee to count the tests must not disarm the
        # reason the step exists.
        run: |
          set -euo pipefail
          cargo test --workspace --locked | tee test-output.txt

      - name: STATUS.md must state the real test count
        # This number has been wrong twice in one day: it is written by hand and nothing
        # checks it, so every PR that adds a test silently makes the project's own account
        # of itself false. A stale count is small on its own and corrosive in aggregate --
        # a document that is casually wrong about something this checkable earns no trust
        # on the claims a reader cannot check.
        #
        # Same principle as the warning-phrase test in bin/helios-bsc/src/bind.rs: a claim
        # nobody verifies is a claim that drifts.
        run: |
          set -euo pipefail
          actual=$(grep -E '^test result:' test-output.txt | awk '{s+=$4} END {print s}')
          claimed=$(grep -oE '^\| Tests \| [0-9]+' STATUS.md | grep -oE '[0-9]+' || true)
          if [ -z "${claimed}" ]; then
            echo "::error::could not find the '| Tests | N' row in STATUS.md"
            exit 1
          fi
          if [ "${claimed}" != "${actual}" ]; then
            echo "::error::STATUS.md claims ${claimed} tests; cargo test ran ${actual}. Update the row."
            exit 1
          fi
          echo "STATUS.md and cargo test agree: ${actual}"
      - name: cargo test helios-bsc-execution
        run: cargo test -p helios-bsc-execution --lib --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `rust-version` said 1.80 while `alloy-eips` -- pulled in by revm -- declares
      # 1.94.1, so the manifest and CONTRIBUTING.md had both been wrong since revm
      # landed. Nothing checked the number, so nothing said so: a reader on 1.80 got a
      # wall of errors from crates they had never heard of instead of "this needs 1.94".
      #
      # Building on exactly the claimed version is the only check that cannot drift.
      # Cargo refuses to compile a dependency whose own `rust-version` is higher than the
      # active rustc, so this fails the moment any dependency raises its floor above ours
      # -- which is how the claim went stale in the first place.
      - name: Build on exactly the MSRV the manifest claims
        run: |
          set -euo pipefail
          msrv=$(grep -m1 "^rust-version = " Cargo.toml | tr -d " \"" | cut -d= -f2)
          if [ -z "${msrv}" ]; then
            echo "::error::could not read rust-version out of Cargo.toml"
            exit 1
          fi
          echo "manifest claims MSRV ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          # `cargo +VERSION` overrides rust-toolchain.toml, which pins `stable`; without
          # the `+` this step would silently test stable and prove nothing.
          cargo +"${msrv}" --version
          cargo +"${msrv}" check --workspace --all-targets --locked

      - name: CONTRIBUTING.md must state the same MSRV
        # Same reason as the test-count guard above: two places holding one number, only
        # one of them checked, is how the number becomes wrong in the uncheckable one.
        run: |
          set -euo pipefail
          msrv=$(grep -m1 "^rust-version = " Cargo.toml | tr -d " \"" | cut -d= -f2)
          if ! grep -qF -- "MSRV is **${msrv}**" CONTRIBUTING.md; then
            echo "::error::Cargo.toml says MSRV ${msrv}; CONTRIBUTING.md does not say so."
            grep -n 'MSRV' CONTRIBUTING.md || true
            exit 1
          fi
          echo "CONTRIBUTING.md agrees: ${msrv}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          # Dummy interpolant only — not a live RPC and not a secret.
          HELIOS_BSC_UPSTREAM: http://127.0.0.1:1
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json | jq -e '
            .services["helios-bsc"].ports
            | map(select((.published | tostring) == "8545" or (.target | tostring) == "8545"))
            | length > 0 and all(.host_ip == "127.0.0.1")
          '
      - name: Dockerfile syntax check
        run: docker build --check .
