name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Channel matches rust-toolchain.toml (stable + clippy, rustfmt); not nightly.
      # Third-party actions run arbitrary code in this job, with access to the tree
      # before `cargo build` sees it. A tag or a branch is a name its owner can move;
      # a commit SHA is not. Dependabot updates these lines and shows the diff, which
      # is the point: an update becomes something a human reads rather than something
      # that happens. `# stable` / `# v2.9.2` say what the SHA was when it was pinned.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test
        # `set -o pipefail` is load-bearing, not decoration. The default shell here is
        # `bash -e`, where the exit status of a pipeline is the *last* command's -- so
        # `cargo test | tee` would report tee's success and a failing test suite would
        # stop failing the build. Piping into tee to count the tests must not disarm the
        # reason the step exists.
        run: |
          set -euo pipefail
          cargo test --workspace --locked | tee test-output.txt

      - name: STATUS.md must state the real test count
        # This number has been wrong twice in one day: it is written by hand and nothing
        # checks it, so every PR that adds a test silently makes the project's own account
        # of itself false. A stale count is small on its own and corrosive in aggregate --
        # a document that is casually wrong about something this checkable earns no trust
        # on the claims a reader cannot check.
        #
        # Same principle as the warning-phrase test in bin/helios-bsc/src/bind.rs: a claim
        # nobody verifies is a claim that drifts.
        run: |
          set -euo pipefail
          actual=$(grep -E '^test result:' test-output.txt | awk '{s+=$4} END {print s}')
          claimed=$(grep -oE '^\| Tests \| [0-9]+' STATUS.md | grep -oE '[0-9]+' || true)
          if [ -z "${claimed}" ]; then
            echo "::error::could not find the '| Tests | N' row in STATUS.md"
            exit 1
          fi
          if [ "${claimed}" != "${actual}" ]; then
            echo "::error::STATUS.md claims ${claimed} tests; cargo test ran ${actual}. Update the row."
            exit 1
          fi
          echo "STATUS.md and cargo test agree: ${actual}"
      - name: cargo test helios-bsc-execution
        run: cargo test -p helios-bsc-execution --lib --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `rust-version` said 1.80 while `alloy-eips` -- pulled in by revm -- declares
      # 1.94.1, so the manifest and CONTRIBUTING.md had both been wrong since revm
      # landed. Nothing checked the number, so nothing said so: a reader on 1.80 got a
      # wall of errors from crates they had never heard of instead of "this needs 1.94".
      #
      # Building on exactly the claimed version is the only check that cannot drift.
      # Cargo refuses to compile a dependency whose own `rust-version` is higher than the
      # active rustc, so this fails the moment any dependency raises its floor above ours
      # -- which is how the claim went stale in the first place.
      - name: Build on exactly the MSRV the manifest claims
        run: |
          set -euo pipefail
          msrv=$(grep -m1 "^rust-version = " Cargo.toml | tr -d " \"" | cut -d= -f2)
          if [ -z "${msrv}" ]; then
            echo "::error::could not read rust-version out of Cargo.toml"
            exit 1
          fi
          echo "manifest claims MSRV ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          # `cargo +VERSION` overrides rust-toolchain.toml, which pins `stable`; without
          # the `+` this step would silently test stable and prove nothing.
          cargo +"${msrv}" --version
          cargo +"${msrv}" check --workspace --all-targets --locked

      - name: CONTRIBUTING.md must state the same MSRV
        # Same reason as the test-count guard above: two places holding one number, only
        # one of them checked, is how the number becomes wrong in the uncheckable one.
        run: |
          set -euo pipefail
          msrv=$(grep -m1 "^rust-version = " Cargo.toml | tr -d " \"" | cut -d= -f2)
          if ! grep -qF -- "MSRV is **${msrv}**" CONTRIBUTING.md; then
            echo "::error::Cargo.toml says MSRV ${msrv}; CONTRIBUTING.md does not say so."
            grep -n 'MSRV' CONTRIBUTING.md || true
            exit 1
          fi
          echo "CONTRIBUTING.md agrees: ${msrv}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          # Dummy interpolant only — not a live RPC and not a secret.
          HELIOS_BSC_UPSTREAM: http://127.0.0.1:1
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json | jq -e '
            .services["helios-bsc"].ports
            | map(select((.published | tostring) == "8545" or (.target | tostring) == "8545"))
            | length > 0 and all(.host_ip == "127.0.0.1")
          '
      - name: compose must keep the container hardening
        # docs/threat-model.md calls the container the one path where both in-process
        # guards are inactive by construction, so what is left is the runtime the
        # operator gets handed. Each of these four is free here -- this process needs no
        # capabilities, writes nothing outside the checkpoint volume, and never becomes
        # another user -- which is exactly why a future edit could drop one without
        # noticing anything break. Assert them, or they are decoration.
        #
        # The second half is the assertions asserting themselves. A check that cannot
        # fail is worse than none, and "jq -e on a missing key exits non-zero" is a claim
        # about jq, not about this repository -- so the same four queries are run against
        # a copy of the config with the hardening stripped out, and every one of them has
        # to fail. If a query is ever mistyped into something vacuously true, that half
        # goes red even while the real config is fine.
        env:
          HELIOS_BSC_UPSTREAM: http://127.0.0.1:1
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --format json > compose.json

          READ_ONLY='.services["helios-bsc"].read_only == true'
          CAP_DROP='.services["helios-bsc"].cap_drop == ["ALL"]'
          NO_NEW_PRIV='.services["helios-bsc"].security_opt | index("no-new-privileges:true")'
          TMPFS='.services["helios-bsc"].tmpfs | length > 0'

          check() {
            if ! jq -e "$1" compose.json > /dev/null; then
              echo "::error::compose lost $2"
              exit 1
            fi
          }
          check "${READ_ONLY}" 'read_only'
          check "${CAP_DROP}" 'cap_drop: [ALL]'
          check "${NO_NEW_PRIV}" 'no-new-privileges'
          check "${TMPFS}" 'the tmpfs a read-only root needs for tmp+rename'
          echo "compose hardening intact"

          jq 'del(.services["helios-bsc"].read_only,
                  .services["helios-bsc"].cap_drop,
                  .services["helios-bsc"].security_opt,
                  .services["helios-bsc"].tmpfs)' compose.json > stripped.json
          for q in "${READ_ONLY}" "${CAP_DROP}" "${NO_NEW_PRIV}" "${TMPFS}"; do
            if jq -e "${q}" stripped.json > /dev/null 2>&1; then
              echo "::error::this check passes on a config with the hardening removed, so it checks nothing: ${q}"
              exit 1
            fi
          done
          echo "and each of those four checks fails when the setting is removed"

      - name: the Dockerfile must declare a healthcheck
        # A grep, not an inspection: building the image here would add minutes to every
        # PR, and the image *is* built and its healthcheck *is* inspected on every
        # release -- see the "the published image is healthy-by-construction" step in
        # release.yml. This catches the edit that deletes the line.
        run: |
          set -euo pipefail
          grep -q '^HEALTHCHECK ' Dockerfile || {
            echo "::error::Dockerfile has no HEALTHCHECK -- a container can then be up, answering, and stalled, with nothing saying so"
            exit 1
          }
          grep -q '"health"' Dockerfile || {
            echo "::error::HEALTHCHECK no longer calls the health subcommand"
            exit 1
          }
          echo "Dockerfile declares a healthcheck that runs the health subcommand"

      - name: Dockerfile syntax check
        run: docker build --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown tables must render as tables
        # STATUS.md is the page a reader lands on first, and its milestone table had two
        # stray blank lines in it: GitHub renders a `| a | b |` line after a blank line as
        # literal text, so the four newest entries showed as pipe-soup. No test, link
        # checker or one-row diff catches that. This does, and it found a second one in
        # docs/README.md the moment it was written.
        run: python3 scripts/check_markdown_tables.py
      - name: The audit scope figure still matches the code
        # The size of the trust surface is quoted where a reader cannot check it against
        # the code, and it had drifted about 20% before anyone noticed -- a figure nobody
        # re-measures is a figure that quietly becomes false. The band is 5% so this
        # reports real drift rather than firing on ordinary growth.
        run: python3 scripts/audit_scope.py --check 13600
