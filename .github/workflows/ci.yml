name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Channel matches rust-toolchain.toml (stable + clippy, rustfmt); not nightly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test
        # `set -o pipefail` is load-bearing, not decoration. The default shell here is
        # `bash -e`, where the exit status of a pipeline is the *last* command's -- so
        # `cargo test | tee` would report tee's success and a failing test suite would
        # stop failing the build. Piping into tee to count the tests must not disarm the
        # reason the step exists.
        run: |
          set -euo pipefail
          cargo test --workspace --locked | tee test-output.txt

      - name: STATUS.md must state the real test count
        # This number has been wrong twice in one day: it is written by hand and nothing
        # checks it, so every PR that adds a test silently makes the project's own account
        # of itself false. A stale count is small on its own and corrosive in aggregate --
        # a document that is casually wrong about something this checkable earns no trust
        # on the claims a reader cannot check.
        #
        # Same principle as the warning-phrase test in bin/helios-bsc/src/bind.rs: a claim
        # nobody verifies is a claim that drifts.
        run: |
          set -euo pipefail
          actual=$(grep -E '^test result:' test-output.txt | awk '{s+=$4} END {print s}')
          claimed=$(grep -oE '^\| Tests \| [0-9]+' STATUS.md | grep -oE '[0-9]+' || true)
          if [ -z "${claimed}" ]; then
            echo "::error::could not find the '| Tests | N' row in STATUS.md"
            exit 1
          fi
          if [ "${claimed}" != "${actual}" ]; then
            echo "::error::STATUS.md claims ${claimed} tests; cargo test ran ${actual}. Update the row."
            exit 1
          fi
          echo "STATUS.md and cargo test agree: ${actual}"
      - name: cargo test helios-bsc-execution
        run: cargo test -p helios-bsc-execution --lib --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          # Dummy interpolant only — not a live RPC and not a secret.
          HELIOS_BSC_UPSTREAM: http://127.0.0.1:1
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json | jq -e '
            .services["helios-bsc"].ports
            | map(select((.published | tostring) == "8545" or (.target | tostring) == "8545"))
            | length > 0 and all(.host_ip == "127.0.0.1")
          '
      - name: compose must keep the container hardening
        # docs/threat-model.md calls the container the one path where both in-process
        # guards are inactive by construction, so what is left is the runtime the
        # operator gets handed. Each of these four is free here -- this process needs no
        # capabilities, writes nothing outside the checkpoint volume, and never becomes
        # another user -- which is exactly why a future edit could drop one without
        # noticing anything break. Assert them, or they are decoration.
        env:
          HELIOS_BSC_UPSTREAM: http://127.0.0.1:1
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --format json > compose.json
          check() {
            if ! jq -e "$1" compose.json > /dev/null; then
              echo "::error::compose lost $2"
              exit 1
            fi
          }
          check '.services["helios-bsc"].read_only == true' 'read_only'
          check '.services["helios-bsc"].cap_drop == ["ALL"]' 'cap_drop: [ALL]'
          check '.services["helios-bsc"].security_opt | index("no-new-privileges:true")' 'no-new-privileges'
          check '.services["helios-bsc"].tmpfs | length > 0' 'the tmpfs a read-only root needs for tmp+rename'
          echo "compose hardening intact"

      - name: the Dockerfile must declare a healthcheck
        # A grep, not an inspection: building the image here would add minutes to every
        # PR, and the image *is* built and its healthcheck *is* inspected on every
        # release -- see the "the published image is healthy-by-construction" step in
        # release.yml. This catches the edit that deletes the line.
        run: |
          set -euo pipefail
          grep -q '^HEALTHCHECK ' Dockerfile || {
            echo "::error::Dockerfile has no HEALTHCHECK -- a container can then be up, answering, and stalled, with nothing saying so"
            exit 1
          }
          grep -q '"health"' Dockerfile || {
            echo "::error::HEALTHCHECK no longer calls the health subcommand"
            exit 1
          }
          echo "Dockerfile declares a healthcheck that runs the health subcommand"

      - name: Dockerfile syntax check
        run: docker build --check .
